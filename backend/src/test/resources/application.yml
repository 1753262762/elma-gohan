spring:
  application:
    name: elma-gohan-backend-test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_TEST_NAME:elma_test}
    username: ${DB_USERNAME:postgres}
    # 口令不设默认值,公开仓库不携带任何真实凭据;运行测试前设置 DB_PASSWORD
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health

elma:
  amap:
    key: test-key
    base-url: http://localhost:1
    types: "050000"
    page-size: 25
    max-pages: 2
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    category-map:
      "050100": { code: CHINESE, label: 中餐厅 }
      "050300": { code: SNACK, label: 小吃快餐 }
  evidence:
    provider: file
    location: classpath:evidence/test-evidence.json
    max-reviews-per-restaurant: 200
  risk:
    algorithm-version: risk-v0.3
    rating:
      fair-min: 4.0
      good-min: 4.2
      excellent-min: 4.5
    price-anomaly-ratio: 1.5
    levels:
      low-max-inclusive: 20
      medium-low-max-inclusive: 40
      medium-max-inclusive: 60
  recommendation:
    algorithm-version: recommendation-v0.3
    top-k: 10
    pool-size: 6
    walking-speed-meters-per-minute: 80
    weights:
      rating: 25
      distance: 20
      budget: 15
      category: 10
      completeness: 10
      risk: 20
    uncertainty-risk: 50
    taste:
      max-adjustment: 15
      category-weight: 0.50
      price-weight: 0.25
      distance-weight: 0.25
  taste:
    decay: 0.95
    max-absolute-weight: 3.0
    feedback:
      like: 1.0
      normal: 0.1
      dislike: -1.0
    price-band-upper-bounds: [30, 60, 100]
    distance-band-upper-bounds: [500, 1000, 2000]
